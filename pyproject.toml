[tool.black]
line-length = 80

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
strict = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = false
# Ignore autogenerated migrations
exclude = "(^|/)migrations/|.*/tests/factories\\.py$"

[tool.django-stubs]
django_settings_module = "Chartist.settings"

[[tool.mypy.overrides]]
module = ["*.tests.factories", "*.tests.factories.*", "*.tasks", "*.tasks.*", "*.admin"]
ignore_errors = true

[tool.ruff.lint]
# Pin to the rules used before the ruff 0.16 upgrade, which enables many more
# rules by default. Adopting new rules is a separate decision.
select = ["E4", "E7", "E9", "F"]
